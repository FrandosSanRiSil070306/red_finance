
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Finance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Red Finance</h1>
    <p>Seu dinheiro, sob controle.</p>
    


<div class="painel">

    <div class="cartao">
        <h2>Saldo atual</h2>
        <p id="saldo">R$ 0,00</p>
    </div>

    <div class="cartao">
        <h2>Entradas</h2>
        <p id="entradas">R$ 0,00</p>
    </div>

    <div class="cartao">
        <h2>Saídas</h2>
        <p id="saidas">R$ 0,00</p>
    </div>

</div>


<section class="grafico-container">
    <h2>Despesas por categoria</h2>
    <div class="grafico-area">
        <canvas id="graficoDespesas"></canvas>
    </div>
</section>


<label for="categoria">Categoria:</label>

<select id="categoria">
    <option value="salario">Salário</option>
    <option value="moradia">Moradia</option>
    <option value="alimentacao">Alimentação</option>
    <option value="transporte">Transporte</option>
    <option value="saude">Saúde</option>
    <option value="lazer">Lazer</option>
    <option value="educacao">Educação</option>
    <option value="trabalho">Trabalho</option>
    <option value="outros">Outros</option>
</select>


<section class="movimentacoes">

    <h2>Registrar movimentação</h2>

    <form id="formulario">
        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao" placeholder="Ex.: Salário">

        <label for="valor">Valor (R$):</label>
        <input type="number" id="valor" placeholder="Ex.: 2200.00" step="0.01">

        <label for="tipo">Tipo:</label>
        <select id="tipo">
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
        </select>

        
        <label for="data">Data da movimentação</label>
        <input type="date" id="data" required>


        <button type="submit">Adicionar movimentação</button>
    </form>

</section>


<section class="historico">
    <h2>Histórico de movimentações</h2>

    <ul id="listaMovimentacoes">
        <label for="filtroCategoria">Filtrar por categoria:</label>


<label for="filtroMes">Consultar mês</label>
<input type="month" id="filtroMes">


<select id="filtroCategoria">
    <option value="todas">Todas as categorias</option>
    <option value="salario">Salário</option>
    <option value="moradia">Moradia</option>
    <option value="alimentacao">Alimentação</option>
    <option value="transporte">Transporte</option>
    <option value="saude">Saúde</option>
    <option value="lazer">Lazer</option>
    <option value="educacao">Educação</option>
    <option value="trabalho">Trabalho</option>
    <option value="outros">Outros</option>
</select>
    </ul>
</section>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
